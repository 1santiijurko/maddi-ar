<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>MADDI — Prueba AR 02</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.7/aframe/build/aframe-ar.js"></script>
<style>
body{margin:0;overflow:hidden;background:#111;font-family:Arial,sans-serif}
#estado{position:fixed;z-index:10;top:12px;left:12px;right:12px;background:#173b34e8;color:white;padding:12px;text-align:center;border-radius:12px;font-size:15px;pointer-events:none}
#pie{position:fixed;z-index:10;bottom:15px;left:12px;right:12px;background:#111c;color:white;text-align:center;padding:9px;border-radius:10px;font-size:12px;pointer-events:none}
</style>
<script>
AFRAME.registerComponent('estado-marcador',{init:function(){
const estado=document.getElementById('estado');
this.el.addEventListener('markerFound',()=>estado.textContent='¡MADDI se columpia sobre el papel!');
this.el.addEventListener('markerLost',()=>estado.textContent='Enfoca el marcador HIRO completo');
}});
AFRAME.registerComponent('balanceo-suave',{tick:function(t){
this.el.object3D.rotation.x=0.16*Math.sin(t/850);
}});
</script>
</head>
<body>
<div id="estado">Permite la cámara y enfoca el marcador HIRO</div>
<div id="pie">MADDI 2.0 · Prueba 02 · Columpio 3D provisional, sin semejanza facial ni captura de colores</div>
<a-scene embedded vr-mode-ui="enabled:false" renderer="logarithmicDepthBuffer:true;antialias:true" arjs="sourceType:webcam;debugUIEnabled:false;trackingMethod:best;" device-orientation-permission-ui="enabled:false">
<a-marker preset="hiro" estado-marcador>
<!-- Suelo discreto y estructura fija -->
<a-circle rotation="-90 0 0" position="0 0.005 0" radius="0.47" color="#BDE8CF" opacity="0.45" material="transparent:true"></a-circle>
<a-cylinder position="-0.34 0.37 0" radius="0.025" height="0.74" color="#5C9EAA"></a-cylinder>
<a-cylinder position="0.34 0.37 0" radius="0.025" height="0.74" color="#5C9EAA"></a-cylinder>
<a-cylinder position="0 0.73 0" rotation="0 0 90" radius="0.028" height="0.74" color="#4A8293"></a-cylinder>
<!-- Pivote: solo gira el asiento con la niña -->
<a-entity position="0 0.72 0" balanceo-suave>
<a-cylinder position="-0.20 -0.26 0" radius="0.008" height="0.52" color="#F4D18C"></a-cylinder>
<a-cylinder position="0.20 -0.26 0" radius="0.008" height="0.52" color="#F4D18C"></a-cylinder>
<a-box position="0 -0.52 0" width="0.47" height="0.045" depth="0.23" color="#E9A45D"></a-box>
<!-- Personaje esquemático, no retrato -->
<a-sphere position="0 -0.30 0" radius="0.095" color="#F0BD97"></a-sphere>
<a-sphere position="0 -0.265 -0.012" radius="0.098" color="#5B3D35" scale="1 0.70 0.85"></a-sphere>
<a-sphere position="0 -0.315 0.025" radius="0.09" color="#F0BD97"></a-sphere>
<a-sphere position="-0.029 -0.32 0.104" radius="0.006" color="#4B3332"></a-sphere>
<a-sphere position="0.029 -0.32 0.104" radius="0.006" color="#4B3332"></a-sphere>
<a-cone position="0 -0.445 0" radius-bottom="0.12" radius-top="0.065" height="0.19" color="#F39AB2"></a-cone>
<a-cylinder position="-0.105 -0.43 0" rotation="0 0 -55" radius="0.025" height="0.19" color="#F0BD97"></a-cylinder>
<a-cylinder position="0.105 -0.43 0" rotation="0 0 55" radius="0.025" height="0.19" color="#F0BD97"></a-cylinder>
<a-cylinder position="-0.07 -0.59 0.07" rotation="70 0 0" radius="0.027" height="0.16" color="#557FC3"></a-cylinder>
<a-cylinder position="0.07 -0.59 0.07" rotation="70 0 0" radius="0.027" height="0.16" color="#557FC3"></a-cylinder>
</a-entity>
<!-- Letras fijas, orientadas sobre el papel -->
<a-text value="MADDI" position="0 0.025 0.38" rotation="-90 0 0" align="center" color="#D65A83" width="1.6" material="side:double"></a-text>
</a-marker>
<a-entity camera></a-entity>
</a-scene>
</body>
</html>
